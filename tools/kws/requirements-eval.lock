# K2 评测门禁（tools/kws/k2_eval_gate.py）的钉死依赖清单
#
# 为什么需要这个文件：K2 门禁的 NC2a / NC2b / NC2d / C9 四项都要真跑 TFLite 解释器。
# 本机（39-fans）此前缺 ai_edge_litert 且 pip 走代理 502，门禁只能降级成
# 16 PASS + 4 NOT_RUN（gate 自己报 NOT_RUN，不谎报 PASS）。为了让"20/20"可复现，
# 依赖必须钉到版本 + wheel 哈希，而不是"装个 tflite 就行"。
#
# 安装（隔离 venv，不动系统 Python）：
#   python -m venv %USERPROFILE%\.workbuddy\binaries\python\envs\kws
#   %USERPROFILE%\.workbuddy\binaries\python\envs\kws\Scripts\python.exe -m pip install \
#       --require-hashes -r tools/kws/requirements-eval.lock
#
# 验证：
#   <venv>\Scripts\python.exe -c "import ai_edge_litert, numpy; print(ai_edge_litert.__version__)"
#   <venv>\Scripts\python.exe tools/kws/k2_eval_gate.py --run-id <新 run_id>
#
# 平台：win_amd64（wheel 名已写明）。换平台/换 Python 小版本要重出本文件——
# ai_edge_litert 只发 abi 专用 wheel（cp310..cp314），没有 py3-none-any 兜底。
#
# 参考：verification/kws/k2/eval_gate/2026-10-21_k2gate_pinned/ENV_PIN.md
#       （该目录记录了本清单下 20/20 的实跑结果与跨机 predictions.jsonl md5 对拍）

